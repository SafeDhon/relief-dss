<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar-left">
        <img
          src="https://safedhon.github.io/relief-dss/images/logo.png"
          alt="โลโก้"
          class="appbar-logo"
        />
        <span class="appbar-title"
          >ระบบสนับสนุนการตัดสินใจในการจัดสรรทรัพยากรบรรเทาสาธารณภัยของกองทัพอากาศ</span
        >
      </div>
    </header>
    <div class="login-container">
      <div class="login-card">
        <img
          src="https://safedhon.github.io/relief-dss/images/logo.png"
          alt="โลโก้"
          class="my-logo"
        />
        <input
          type="email"
          id="email"
          placeholder="ชื่อผู้ใช้"
          class="login-input"
        />
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="รหัสผ่าน"
            class="login-input password-input"
          />
          <button
            type="button"
            id="togglePassword"
            class="toggle-password"
            aria-label="แสดงรหัสผ่าน"
            title="แสดงรหัสผ่าน"
          >
            <!-- ตาเปิด: กดเพื่อแสดงรหัสผ่าน -->
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <!-- ตาปิด: กดเพื่อซ่อนรหัสผ่าน -->
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <button id="loginBtn" class="login-btn">เข้าสู่ระบบ</button>
        <p id="errorMsg" class="error-msg"></p>
      </div>
    </div>

    <script type="module" src="../js/login.js"></script>
  </body>
</html>
